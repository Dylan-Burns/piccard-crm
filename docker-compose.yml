services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: roofing
      POSTGRES_USER: roofing
      POSTGRES_PASSWORD: password
    volumes: [pgdata:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U roofing"]
      interval: 5s
      timeout: 5s
      retries: 10
  app:
    build: .
    ports: ["8000:8000"]
    env_file: .env
    depends_on:
      db:
        condition: service_healthy
    volumes: [uploads:/data/uploads]
volumes:
  pgdata:
  uploads:
